{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: fastapi
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - "*"
  gateways:
    - fastapi-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: python-api
            port:
              number: 80
{{- end }}
