apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: redis-allow-python-api
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app: redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/python-api"
      to:
        - operation:
            ports:
              - "6379"
