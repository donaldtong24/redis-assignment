{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
spec:
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: redis-strict
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: redis
  mtls:
    mode: STRICT
{{- end }}
