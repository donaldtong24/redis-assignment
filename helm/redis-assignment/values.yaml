replicaCount: 2

image:
  repository: python-api
  tag: latest
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

redis:
  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent

  service:
    port: 6379

  storage:
    size: 1Gi
    storageClassName: standard

  password: redis-123

ingress:
  enabled: true
  className: nginx
  host: localhost
  path: /api(.*)
istio:
  enabled: true
